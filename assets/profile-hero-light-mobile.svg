<svg xmlns="http://www.w3.org/2000/svg" width="640" height="690" viewBox="0 0 640 690" role="img" aria-labelledby="title desc">
<title id="title">REZVENT — ML / AI Engineer</title>
<desc id="desc">Applied intelligence and engineering. From experiments to dependable systems. An abstract neural network connects data, training, evaluation, serving and observation.</desc>
<defs>
