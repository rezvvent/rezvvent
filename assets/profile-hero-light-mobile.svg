  .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
  .signal { stroke-dasharray: 14 240; animation: flow 9s linear infinite; }
  .pulse { animation: pulse 5s ease-in-out infinite; }
  @keyframes flow { to { stroke-dashoffset: -508; } }
  @keyframes pulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .signal, .pulse { animation: none; } }
</style>
