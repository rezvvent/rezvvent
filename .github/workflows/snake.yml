name: Generate contribution animation

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate SVG and GIF animations
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/contribution-snake.svg?color_snake=#3D6A11&color_dots=#EFF2E8,#DCECC5,#B3D88B,#7FAF45,#3D6A11
            dist/contribution-snake-dark.svg?palette=github-dark&color_snake=#CCFF7A&color_dots=#0B0F14,#253A22,#496735,#8DB85A,#CCFF7A
            dist/contribution-snake.gif?color_snake=#CCFF7A&color_dots=#0B0F14,#253A22,#496735,#8DB85A,#CCFF7A

      - name: Publish animations to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
